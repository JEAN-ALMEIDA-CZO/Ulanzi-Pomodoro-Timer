<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" fill="none">
  <defs>
    <linearGradient id="hred" gradientUnits="userSpaceOnUse" x1="30" y1="20" x2="190" y2="210">
      <stop offset="0"   stop-color="#ff7a6b"/>
      <stop offset="0.5" stop-color="#E74C3C"/>
      <stop offset="1"   stop-color="#c0392b"/>
    </linearGradient>
  </defs>

  <!-- icon (timer mark), scaled into the left -->
  <g transform="translate(22,12) scale(0.76)">
    <rect x="115" y="14" width="26" height="20" rx="7" fill="url(#hred)"/>
    <rect x="123" y="30" width="10" height="14" rx="3" fill="url(#hred)"/>
    <circle cx="128" cy="142" r="88" fill="none" stroke="url(#hred)" stroke-width="20"
      stroke-linecap="round" stroke-dasharray="430 123" transform="rotate(-108 128 142)"/>
    <line x1="128" y1="142" x2="128" y2="88"  stroke="url(#hred)" stroke-width="17" stroke-linecap="round"/>
    <line x1="128" y1="142" x2="178" y2="142" stroke="url(#hred)" stroke-width="17" stroke-linecap="round"/>
    <circle cx="128" cy="142" r="13" fill="url(#hred)"/>
  </g>

  <!-- wordmark -->
  <text x="232" y="118" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#16181d">Pomodoro</text>
  <text x="234" y="178" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="40" font-weight="700" letter-spacing="6" fill="#E74C3C">TIMER</text>
</svg>
