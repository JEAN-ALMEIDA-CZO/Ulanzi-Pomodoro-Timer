<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ogsil" gradientUnits="userSpaceOnUse" x1="497" y1="70" x2="703" y2="290">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c3c8d0"/>
      <stop offset="1"   stop-color="#eef1f5"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E74C3C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E74C3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2980B9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2980B9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0a0b0d"/>
  <rect x="-200" y="-260" width="900" height="700" fill="url(#glowR)"/>
  <rect x="500"  y="-300" width="900" height="700" fill="url(#glowB)"/>
  <rect x="2" y="2" width="1196" height="626" rx="22" fill="none" stroke="#1c1f26" stroke-width="2"/>

  <!-- icon (silver timer), centered horizontally near the top -->
  <g transform="translate(497.6,70) scale(0.8)">
    <rect x="115" y="14" width="26" height="20" rx="7" fill="url(#ogsil)"/>
    <rect x="123" y="30" width="10" height="14" rx="3" fill="url(#ogsil)"/>
    <circle cx="128" cy="142" r="88" fill="none" stroke="url(#ogsil)" stroke-width="20"
      stroke-linecap="round" stroke-dasharray="430 123" transform="rotate(-108 128 142)"/>
    <line x1="128" y1="142" x2="128" y2="88"  stroke="url(#ogsil)" stroke-width="17" stroke-linecap="round"/>
    <line x1="128" y1="142" x2="178" y2="142" stroke="url(#ogsil)" stroke-width="17" stroke-linecap="round"/>
    <circle cx="128" cy="142" r="13" fill="url(#ogsil)"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="380" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif"
    font-size="92" font-weight="800" letter-spacing="-2" fill="#ffffff">Pomodoro</text>
  <text x="600" y="440" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif"
    font-size="40" font-weight="700" letter-spacing="12" fill="#E74C3C">TIMER</text>

  <!-- tagline -->
  <text x="600" y="508" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif"
    font-size="29" font-weight="500" fill="#9aa3ad">Focus timer with a live progress ring for your Ulanzi Deck</text>

  <!-- credit -->
  <text x="600" y="572" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif"
    font-size="21" font-weight="600" letter-spacing="1" fill="#5b626c">Created by Jean Almeida</text>
</svg>
